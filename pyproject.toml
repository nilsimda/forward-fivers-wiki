[project]
name = "forward-fivers-wiki-data"
version = "0.1.0"
description = "Binary data extraction scripts for MHFG G1 wiki"
requires-python = ">=3.11"
dependencies = [
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=9.0.2",
    "ruff>=0.13.3",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
