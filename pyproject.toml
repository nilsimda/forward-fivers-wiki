[project]
name = "forward-fivers-wiki-data"
version = "0.1.0"
description = "Binary data extraction scripts for MHFG G1 wiki"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["mypy>=1.20.0", "pre-commit>=4.5.1", "pytest>=9.0.2", "ruff>=0.13.3"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["scripts", "tests"]

[tool.mypy]
python_version = "3.14"
files = ["scripts"]
mypy_path = ["scripts"]
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
